services:
  postgres:
    image: postgres:16
    container_name: mediacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediacore
      POSTGRES_PASSWORD: mediacore
      POSTGRES_DB: mediacore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mediacore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-data:
